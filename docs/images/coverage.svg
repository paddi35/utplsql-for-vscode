<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
  <title>Coverage in the editor gutter and the native Coverage view</title>
  <desc>A package body with covered lines marked green in the gutter and an uncovered branch marked red, next to the VS Code Test Coverage panel listing files and their percentages.</desc>

  <rect width="900" height="400" fill="#12182a"/>

  <!-- editor -->
  <rect x="24" y="24" width="530" height="352" rx="8" fill="#1e1e1e" stroke="#2f3b52"/>
  <rect x="24" y="24" width="530" height="30" rx="8" fill="#2d2d2d"/>
  <rect x="24" y="46" width="530" height="8" fill="#2d2d2d"/>
  <rect x="36" y="30" width="150" height="18" rx="3" fill="#1e1e1e"/>
  <text x="48" y="44" fill="#cbd5e1" font-size="11.5">calc_pkg.pkb</text>

  <g font-family="'Cascadia Code',Consolas,monospace" font-size="12">
    <!-- covered lines -->
    <g fill="#3ddc84">
      <rect x="30" y="66" width="3" height="16"/><rect x="30" y="86" width="3" height="16"/>
      <rect x="30" y="106" width="3" height="16"/><rect x="30" y="126" width="3" height="16"/>
      <rect x="30" y="186" width="3" height="16"/><rect x="30" y="206" width="3" height="16"/>
      <rect x="30" y="266" width="3" height="16"/><rect x="30" y="286" width="3" height="16"/>
    </g>
    <!-- uncovered -->
    <g fill="#f14c4c">
      <rect x="30" y="146" width="3" height="16"/><rect x="30" y="166" width="3" height="16"/>
      <rect x="30" y="226" width="3" height="16"/>
    </g>
    <rect x="26" y="146" width="524" height="36" fill="#f14c4c" opacity="0.07"/>
    <rect x="26" y="226" width="524" height="16" fill="#f14c4c" opacity="0.07"/>

    <g fill="#5a6578" text-anchor="end">
      <text x="58" y="78">12</text><text x="58" y="98">13</text><text x="58" y="118">14</text>
      <text x="58" y="138">15</text><text x="58" y="158">16</text><text x="58" y="178">17</text>
      <text x="58" y="198">18</text><text x="58" y="218">19</text><text x="58" y="238">20</text>
      <text x="58" y="258">21</text><text x="58" y="278">22</text><text x="58" y="298">23</text>
    </g>

    <text x="76" y="78" fill="#569cd6">function <tspan fill="#dcdcaa">divide</tspan><tspan fill="#d4d4d4">(a number, b number)</tspan></text>
    <text x="76" y="98" fill="#569cd6">return <tspan fill="#4ec9b0">number</tspan> <tspan fill="#569cd6">is</tspan></text>
    <text x="76" y="118" fill="#569cd6">begin</text>
    <text x="92" y="138" fill="#d4d4d4">if b = 0 then</text>
    <text x="108" y="158" fill="#d4d4d4">raise_application_error(</text>
    <text x="124" y="178" fill="#ce9178">'-20001', 'divide by zero'</text>
    <text x="92" y="198" fill="#d4d4d4">end if;</text>
    <text x="92" y="218" fill="#569cd6">return <tspan fill="#d4d4d4">a / b;</tspan></text>
    <text x="92" y="238" fill="#6a9955">-- never reached by any test</text>
    <text x="76" y="258" fill="#569cd6">exception</text>
    <text x="92" y="278" fill="#569cd6">when <tspan fill="#d4d4d4">others then raise;</tspan></text>
    <text x="76" y="298" fill="#569cd6">end <tspan fill="#dcdcaa">divide</tspan><tspan fill="#d4d4d4">;</tspan></text>
  </g>

  <rect x="40" y="330" width="230" height="28" rx="4" fill="#1c2e24" stroke="#3ddc84"/>
  <text x="56" y="349" fill="#7ee2a8" font-size="11.5">green = executed · red = never executed</text>

  <!-- coverage panel -->
  <rect x="580" y="24" width="296" height="352" rx="8" fill="#252526" stroke="#2f3b52"/>
  <rect x="580" y="24" width="296" height="36" rx="8" fill="#2d2d2d"/>
  <rect x="580" y="50" width="296" height="10" fill="#2d2d2d"/>
  <text x="600" y="47" fill="#cbd5e1" font-size="12.5" letter-spacing="0.8">TEST COVERAGE</text>

  <g font-size="12.5">
    <text x="600" y="88" fill="#e6edf3" font-weight="600">UT3</text>
    <text x="856" y="88" fill="#7ee2a8" text-anchor="end" font-weight="600">78%</text>
    <rect x="600" y="96" width="256" height="4" rx="2" fill="#33384a"/>
    <rect x="600" y="96" width="200" height="4" rx="2" fill="#3ddc84"/>

    <text x="616" y="130" fill="#cbd5e1">calc_pkg.pkb</text>
    <text x="856" y="130" fill="#e0b062" text-anchor="end">64%</text>
    <rect x="616" y="138" width="240" height="4" rx="2" fill="#33384a"/>
    <rect x="616" y="138" width="154" height="4" rx="2" fill="#e0b062"/>

    <text x="616" y="172" fill="#cbd5e1">string_utils_pkg.pkb</text>
    <text x="856" y="172" fill="#7ee2a8" text-anchor="end">100%</text>
    <rect x="616" y="180" width="240" height="4" rx="2" fill="#33384a"/>
    <rect x="616" y="180" width="240" height="4" rx="2" fill="#3ddc84"/>

    <text x="616" y="214" fill="#8b98ab">audit_pkg.pkb</text>
    <text x="856" y="214" fill="#f0a3a3" text-anchor="end">0%</text>
    <rect x="616" y="222" width="240" height="4" rx="2" fill="#33384a"/>
  </g>

  <rect x="600" y="252" width="256" height="106" rx="6" fill="#1b2b3d" stroke="#2d8cf0"/>
  <text x="616" y="276" fill="#6ec1ff" font-size="12" font-weight="600">Scope is derived, not guessed</text>
  <text x="616" y="298" fill="#9aa7ba" font-size="11.5">What the test packages depend on,</text>
  <text x="616" y="316" fill="#9aa7ba" font-size="11.5">minus the test packages themselves.</text>
  <text x="616" y="340" fill="#9aa7ba" font-size="11.5">Override it with utplsql.coverage.*</text>
</svg>
