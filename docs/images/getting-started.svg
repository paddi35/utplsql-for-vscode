<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
  <title>The four steps from install to a first test run</title>
  <desc>Step one: add a connection. Step two: open the Testing view and expand the profile. Step three: run a test. Step four: run with coverage.</desc>

  <rect width="900" height="300" fill="#12182a"/>

  <defs>
    <marker id="step" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a4761"/>
    </marker>
  </defs>

  <g font-size="12.5">
    <!-- 1 -->
    <rect x="24" y="56" width="190" height="180" rx="9" fill="#1e1e1e" stroke="#2d8cf0"/>
    <circle cx="52" cy="86" r="15" fill="#2d8cf0"/>
    <text x="52" y="91" fill="#0d1117" font-size="15" font-weight="700" text-anchor="middle">1</text>
    <text x="78" y="91" fill="#e6edf3" font-size="13.5" font-weight="600">Add Connection</text>
    <text x="44" y="126" fill="#cbd5e1">Command Palette →</text>
    <text x="44" y="146" fill="#6ec1ff">utPLSQL: Add Connection</text>
    <text x="44" y="174" fill="#8b98ab" font-size="11.5">name, user, connect string,</text>
    <text x="44" y="192" fill="#8b98ab" font-size="11.5">optional default schema</text>
    <text x="44" y="218" fill="#7ee2a8" font-size="11.5">password → SecretStorage</text>

    <!-- 2 -->
    <rect x="252" y="56" width="190" height="180" rx="9" fill="#1e1e1e" stroke="#2f3b52"/>
    <circle cx="280" cy="86" r="15" fill="#3a4761"/>
    <text x="280" y="91" fill="#e6edf3" font-size="15" font-weight="700" text-anchor="middle">2</text>
    <text x="306" y="91" fill="#e6edf3" font-size="13.5" font-weight="600">Expand it</text>
    <text x="272" y="126" fill="#cbd5e1">Open the Testing view.</text>
    <text x="272" y="154" fill="#8b98ab" font-size="11.5">The profile is the root node.</text>
    <text x="272" y="172" fill="#8b98ab" font-size="11.5">Expanding discovers schemas,</text>
    <text x="272" y="190" fill="#8b98ab" font-size="11.5">then suites, contexts, tests —</text>
    <text x="272" y="208" fill="#8b98ab" font-size="11.5">one level at a time.</text>

    <!-- 3 -->
    <rect x="480" y="56" width="190" height="180" rx="9" fill="#1e1e1e" stroke="#2f3b52"/>
    <circle cx="508" cy="86" r="15" fill="#3a4761"/>
    <text x="508" y="91" fill="#e6edf3" font-size="15" font-weight="700" text-anchor="middle">3</text>
    <text x="534" y="91" fill="#e6edf3" font-size="13.5" font-weight="600">Run</text>
    <text x="500" y="126" fill="#cbd5e1">From the tree, the gutter,</text>
    <text x="500" y="144" fill="#cbd5e1">or the cursor.</text>
    <text x="500" y="172" fill="#8b98ab" font-size="11.5">Results arrive per test,</text>
    <text x="500" y="190" fill="#8b98ab" font-size="11.5">failures link to the line</text>
    <text x="500" y="208" fill="#8b98ab" font-size="11.5">inside the package body.</text>

    <!-- 4 -->
    <rect x="708" y="56" width="190" height="180" rx="9" fill="#1e1e1e" stroke="#3ddc84"/>
    <circle cx="736" cy="86" r="15" fill="#3ddc84"/>
    <text x="736" y="91" fill="#0d1117" font-size="15" font-weight="700" text-anchor="middle">4</text>
    <text x="762" y="91" fill="#e6edf3" font-size="13.5" font-weight="600">Cover</text>
    <text x="728" y="126" fill="#cbd5e1">Use the</text>
    <text x="728" y="146" fill="#7ee2a8">Run with Coverage</text>
    <text x="728" y="166" fill="#cbd5e1">profile.</text>
    <text x="728" y="194" fill="#8b98ab" font-size="11.5">Per-line hits land in the</text>
    <text x="728" y="212" fill="#8b98ab" font-size="11.5">native Coverage view.</text>
  </g>

  <path d="M214 146 H252" stroke="#3a4761" stroke-width="2" marker-end="url(#step)"/>
  <path d="M442 146 H480" stroke="#3a4761" stroke-width="2" marker-end="url(#step)"/>
  <path d="M670 146 H708" stroke="#3a4761" stroke-width="2" marker-end="url(#step)"/>

  <text x="450" y="274" fill="#6b7a90" font-size="12" text-anchor="middle">No local PL/SQL files? Every cursor-driven command falls back to a QuickPick of what the database has.</text>
</svg>
