name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Typecheck + unit tests
        run: npm test

      - name: Build extension bundle
        run: npm run build

      - name: Package .vsix
        run: npx vsce package

  # Integration tests run in their own workflow (integration.yml), not on
  # every push/PR: first-time Oracle DB creation is slow and unpredictable
  # on GitHub-hosted runners' disks (has taken 15-40+ minutes), which would
  # otherwise make integration coverage block the normal dev/review loop.
