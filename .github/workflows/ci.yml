name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Typecheck + unit tests
        run: npm test

      - name: Build extension bundle
        run: npm run build

      - name: Package .vsix
        run: npx vsce package

  # Integration tests run in their own workflow (integration.yml), not on
  # every push/PR: they need a real Oracle instance, and keeping an
  # infrastructure-dependent suite off the critical path keeps the normal
  # dev/review loop fast and free of infra flakiness.
