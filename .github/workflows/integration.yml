name: Integration Tests

# Deliberately kept off every push/PR (see ci.yml): this job needs a real
# Oracle instance, and infrastructure-dependent suites do not belong on the
# critical path of the normal dev/review loop. Triggerable on demand, plus a
# nightly run so regressions still surface.
#
# This used to time out on every single attempt, for two independent reasons,
# both fixed rather than worked around:
#
#   1. docker-compose.yml mounted an empty named volume over
#      /opt/oracle/oradata, hiding the 3 GB database the faststart base image
#      already ships there. The entrypoint then created the whole database
#      from scratch — 45+ minutes, versus 27 seconds measured without the
#      mount. The volume now lives in docker-compose.override.yml, which
#      Compose does not load here because COMPOSE_FILE is set below.
#   2. The image declared no HEALTHCHECK (the base image does not provide
#      one, contrary to what a comment in docker-compose.yml claimed), so
#      .State.Health.Status stayed empty forever and the wait loop below
#      could never succeed no matter how fast the database came up. The
#      Dockerfile now declares one over the base image's healthcheck.sh.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    env:
      # Applies docker-compose.ci.yml on top of the base file for every
      # `docker compose` call below without repeating -f each time.
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    steps:
      # Oracle Free's first-start DB creation needs a fair amount of disk;
      # ubuntu-latest runners are tight on space by default, so drop
      # preinstalled toolchains we don't use here. Runs before setup-node so
      # it doesn't touch whatever that action places under hostedtoolcache.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build Oracle + utPLSQL image
        run: docker compose build

      - name: Start Oracle + utPLSQL container
        run: docker compose up -d

      - name: Wait for database to become healthy
        run: |
          echo "Waiting for oracle-utplsql container to report healthy (opening the prebuilt database plus the utPLSQL install; expect well under a minute)..."
          # Stream the container's own logs live instead of waiting silently,
          # so a slow/stuck startup is visible in the job log as it happens
          # rather than only after the timeout via the separate (always())
          # "Container logs" step further down.
          docker compose logs -f oracle-utplsql &
          LOG_PID=$!
          trap 'kill "$LOG_PID" 2>/dev/null' EXIT
          timeout 600 bash -c '
            until [ "$(docker inspect -f "{{.State.Health.Status}}" oracle-utplsql 2>/dev/null)" = "healthy" ]; do
              sleep 5
            done
          '

      - name: Run integration tests
        run: npm run test:integration

      - name: Container logs
        if: always()
        run: docker compose logs

      - name: Tear down containers
        if: always()
        run: docker compose down -v
